name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests, Ruff and Home Assistant smoke (HA ${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 2026.7.3 is the minimum release declared in hacs.json; 2026.10.x is
        # the release the maintainer runs in production. Both must stay green.
        homeassistant: ["2026.7.3", "2026.10.3"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install Home Assistant ${{ matrix.homeassistant }} and runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "homeassistant==${{ matrix.homeassistant }}" \
            beautifulsoup4==4.13.3 \
            lxml==6.1.1 \
            pyserial==3.5
          python -m pip check
      - name: Run lifecycle tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python and validate JSON
        run: |
          python -m compileall -q custom_components tests scripts
          for file in custom_components/enocean_custom/manifest.json \
                      custom_components/enocean_custom/strings.json \
                      custom_components/enocean_custom/translations/*.json \
                      custom_components/enocean_custom/icons.json \
                      custom_components/enocean_custom/data/*.json \
                      tests/fixtures/*.json \
                      hacs.json; do
            python -m json.tool "$file" >/dev/null
          done
          # The English runtime translation is the source of truth, byte for byte.
          cmp custom_components/enocean_custom/strings.json \
              custom_components/enocean_custom/translations/en.json
      - name: Lint maintained integration code
        run: |
          python -m pip install --disable-pip-version-check ruff==0.16.0
          # ruff.toml excludes the vendored EnOcean library as a whole; the
          # three files maintained inside it are named explicitly so that
          # they stay covered (Ruff lints explicit paths even when excluded).
          targets=(
            custom_components
            scripts
            tests
            custom_components/enocean_custom/enocean_library/communicators/communicator.py
            custom_components/enocean_custom/enocean_library/communicators/serialcommunicator.py
            custom_components/enocean_custom/enocean_library/protocol/d2.py
          )
          ruff check "${targets[@]}"
          ruff format --check "${targets[@]}"
      - name: Run UTE and D2 commissioning regressions with Home Assistant installed
        run: python -m unittest tests.test_pairing_wizard tests.test_ute_teach_in_policy tests.test_ute_commissioning -v
      - name: Import and validate against Home Assistant ${{ matrix.homeassistant }}
        run: python tests/ha_smoke.py

  pytest-ha:
    name: pytest (config/options flow, diagnostics snapshots) on HA 2026.10.2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install Home Assistant 2026.10.2 and the pytest harness
        run: |
          python -m pip install --disable-pip-version-check \
            "homeassistant==2026.10.2" \
            beautifulsoup4==4.13.3 \
            lxml==6.1.1 \
            pyserial==3.5 \
            pytest==9.0.3 \
            pytest-asyncio==1.4.0 \
            pytest-homeassistant-custom-component==0.13.373 \
            pytest-cov==7.1.0 \
            pytest-freezer==0.4.9 \
            syrupy==6.1.1 \
            aiousbwatcher \
            serialx
          python -m pip check
      # Deliberately partial (M9): this suite covers config/options flow and
      # diagnostics through the real Home Assistant flow manager and
      # registries; it is additive to, not a replacement for, the much
      # larger stdlib unittest suite the job above already runs.
      - name: Run the pytest-homeassistant-custom-component suite
        run: python -m pytest

  release-zip:
    name: HACS release asset (build, --check, install simulation on HA 2026.10.3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      # hacs.json declares zip_release + filename: HACS installs every release
      # from the enocean_custom.zip asset, extracted straight into
      # custom_components/enocean_custom/ (docs/releasing.md). The archive is
      # rebuilt here from the tree, checked against it, then installed exactly
      # the way HACS does it and smoke-tested from that location.
      - name: Build dist/enocean_custom.zip twice and prove the build is deterministic
        run: |
          python scripts/build_release_zip.py --output dist/enocean_custom.zip
          python scripts/build_release_zip.py --output "$RUNNER_TEMP/rebuild.zip" > /dev/null
          cmp dist/enocean_custom.zip "$RUNNER_TEMP/rebuild.zip"
          sha256sum dist/enocean_custom.zip
      - name: Check the archive against the tree and extract it like HACS does
        run: |
          version=$(python -c 'import json; print(json.load(open("custom_components/enocean_custom/manifest.json"))["version"])')
          python scripts/build_release_zip.py --check dist/enocean_custom.zip \
            --version "$version" --install-to "$RUNNER_TEMP/hacs-install"
          python -m json.tool "$RUNNER_TEMP/hacs-install/custom_components/enocean_custom/manifest.json" > /dev/null
          python -m compileall -q "$RUNNER_TEMP/hacs-install/custom_components/enocean_custom"
      - name: Install Home Assistant 2026.10.3 and runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "homeassistant==2026.10.3" \
            beautifulsoup4==4.13.3 \
            lxml==6.1.1 \
            pyserial==3.5
          python -m pip check
      # tests/ha_smoke.py resolves the integration from its own parent
      # directory, so a copy next to the extracted tree exercises that tree,
      # not the repository checkout.
      - name: Import and smoke-test the extracted tree with Home Assistant
        run: |
          install="$RUNNER_TEMP/hacs-install"
          mkdir -p "$install/tests"
          cp tests/ha_smoke.py "$install/tests/ha_smoke.py"
          cd "$install"
          python - <<'PY'
          import os
          import sys

          sys.path.insert(0, os.getcwd())
          import custom_components.enocean_custom as integration

          assert integration.__file__.startswith(os.getcwd()), integration.__file__
          print("imported", integration.__file__)
          PY
          python tests/ha_smoke.py
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: enocean_custom.zip
          path: dist/enocean_custom.zip
          if-no-files-found: error

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/hacs
        with:
          category: integration
          comment: false

  hassfest:
    name: Hassfest 2026.7.3
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Run Hassfest 2026.7.3 from an immutable image
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            ghcr.io/home-assistant/hassfest@sha256:03c1642d3a057a9e20759a41278d4427f3cb8bd90b0d2eb4ac5248a1064e6da1

  dependency-audit:
    name: Runtime dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Audit declared runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python - <<'PY' > /tmp/enocean-runtime-requirements.txt
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/enocean_custom/manifest.json").read_text()
          )
          print("\n".join(manifest["requirements"]))
          PY
          python -m pip_audit --strict -r /tmp/enocean-runtime-requirements.txt
