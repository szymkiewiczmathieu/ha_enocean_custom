name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Run lifecycle tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python and validate JSON
        run: |
          python -m compileall -q custom_components tests
          python -m json.tool custom_components/enocean_custom/manifest.json >/dev/null
          python -m json.tool hacs.json >/dev/null
      - name: Install Home Assistant 2026.7.3 and runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            homeassistant==2026.7.3 \
            beautifulsoup4==4.13.3 \
            lxml==6.1.1 \
            pyserial==3.5
      - name: Import and validate against Home Assistant 2026.7.3
        run: python tests/ha_smoke.py

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          comment: false

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: home-assistant/actions/hassfest@e3fb68ebda13d88a0d695082f471ba2c83d025fb # master
