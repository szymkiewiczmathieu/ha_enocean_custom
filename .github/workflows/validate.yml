name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests, Ruff and Home Assistant smoke (HA ${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 2026.7.3 is the minimum release declared in hacs.json; 2026.10.x is
        # the release the maintainer runs in production. Both must stay green.
        homeassistant: ["2026.7.3", "2026.10.3"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install Home Assistant ${{ matrix.homeassistant }} and runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "homeassistant==${{ matrix.homeassistant }}" \
            beautifulsoup4==4.13.3 \
            lxml==6.1.1 \
            pyserial==3.5
          python -m pip check
      - name: Run lifecycle tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python and validate JSON
        run: |
          python -m compileall -q custom_components tests scripts
          for file in custom_components/enocean_custom/manifest.json \
                      custom_components/enocean_custom/strings.json \
                      custom_components/enocean_custom/translations/*.json \
                      custom_components/enocean_custom/icons.json \
                      custom_components/enocean_custom/data/*.json \
                      tests/fixtures/*.json \
                      hacs.json; do
            python -m json.tool "$file" >/dev/null
          done
          # The English runtime translation is the source of truth, byte for byte.
          cmp custom_components/enocean_custom/strings.json \
              custom_components/enocean_custom/translations/en.json
      - name: Lint maintained integration code
        run: |
          python -m pip install --disable-pip-version-check ruff==0.16.0
          # ruff.toml excludes the vendored EnOcean library as a whole; the
          # three files maintained inside it are named explicitly so that
          # they stay covered (Ruff lints explicit paths even when excluded).
          targets=(
            custom_components
            scripts
            tests
            custom_components/enocean_custom/enocean_library/communicators/communicator.py
            custom_components/enocean_custom/enocean_library/communicators/serialcommunicator.py
            custom_components/enocean_custom/enocean_library/protocol/d2.py
          )
          ruff check "${targets[@]}"
          ruff format --check "${targets[@]}"
      - name: Run UTE and D2 commissioning regressions with Home Assistant installed
        run: python -m unittest tests.test_pairing_wizard tests.test_ute_teach_in_policy tests.test_ute_commissioning -v
      - name: Import and validate against Home Assistant ${{ matrix.homeassistant }}
        run: python tests/ha_smoke.py

  pytest-ha:
    name: pytest (config/options flow, diagnostics snapshots) on HA 2026.10.2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install Home Assistant 2026.10.2 and the pytest harness
        run: |
          python -m pip install --disable-pip-version-check \
            "homeassistant==2026.10.2" \
            beautifulsoup4==4.13.3 \
            lxml==6.1.1 \
            pyserial==3.5 \
            pytest==9.0.3 \
            pytest-asyncio==1.4.0 \
            pytest-homeassistant-custom-component==0.13.373 \
            pytest-cov==7.1.0 \
            pytest-freezer==0.4.9 \
            syrupy==6.1.1 \
            aiousbwatcher \
            serialx
          python -m pip check
      # Deliberately partial (M9): this suite covers config/options flow and
      # diagnostics through the real Home Assistant flow manager and
      # registries; it is additive to, not a replacement for, the much
      # larger stdlib unittest suite the job above already runs.
      - name: Run the pytest-homeassistant-custom-component suite
        run: python -m pytest

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/hacs
        with:
          category: integration
          comment: false

  hassfest:
    name: Hassfest 2026.7.3
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Run Hassfest 2026.7.3 from an immutable image
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            ghcr.io/home-assistant/hassfest@sha256:03c1642d3a057a9e20759a41278d4427f3cb8bd90b0d2eb4ac5248a1064e6da1

  dependency-audit:
    name: Runtime dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Audit declared runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python - <<'PY' > /tmp/enocean-runtime-requirements.txt
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/enocean_custom/manifest.json").read_text()
          )
          print("\n".join(manifest["requirements"]))
          PY
          python -m pip_audit --strict -r /tmp/enocean-runtime-requirements.txt
