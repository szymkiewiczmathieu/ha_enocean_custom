climate_teach_in_actor:
  name: Teach in climate actuator
  description: Transmit the configured climate profile's teach-in telegram to the selected actuator.
  target:
    entity:
      domain: climate
      integration: enocean_custom

climate_teach_in_actor_switch:
  name: Teach in climate rocker input
  description: Transmit the legacy RPS teach-in telegram to the selected SRC-D08 actuator.
  target:
    entity:
      domain: climate
      integration: enocean_custom

learn:
  name: Start EnOcean teach-in
  description: Listen for the next unknown EnOcean sender and fire enocean_custom_device_learned once one is captured.
  fields:
    timeout:
      name: Timeout
      description: Seconds to listen before giving up.
      required: false
      default: 60
      selector:
        number:
          min: 15
          max: 300
          unit_of_measurement: seconds
          mode: box

send_teach_in:
  name: Send dimmer teach-in
  description: Send an A5-38-08 4BS teach-in telegram using the selected light entity's sender ID.
  target:
    entity:
      domain: light
      integration: enocean_custom

commission_ute:
  name: Commission Ubiwizz by directed UTE response
  description: >-
    Open a listener for the selected UBID1507C output before its documented
    local association sequence (three short PRESS presses for output 1; the
    same three plus one extra short PRESS for output 2). When that configured
    module broadcasts the exact D4/A0 request, send the directed accepted D4/91
    response using the resolved dongle Base ID and the module EURID. It never
    sends a broadcast UTE query or a D2 relay command. ESP3 acceptance proves
    only dongle transport; verify normal D2 feedback afterwards.
  target:
    entity:
      domain: switch
      integration: enocean_custom

reload:
  name: Reload EnOcean YAML platforms
  description: Reload YAML-configured EnOcean platforms from the current configuration.
