climate_teach_in_actor:
  name: Teach in climate actuator
  description: Transmit the configured climate profile's teach-in telegram to the selected actuator.
  target:
    entity:
      domain: climate
      integration: enocean_custom

climate_teach_in_actor_switch:
  name: Teach in climate rocker input
  description: Transmit the legacy RPS teach-in telegram to the selected SRC-D08 actuator.
  target:
    entity:
      domain: climate
      integration: enocean_custom

learn:
  name: Start EnOcean teach-in
  description: Listen for the next unknown EnOcean sender and fire enocean_custom_device_learned once one is captured.
  fields:
    timeout:
      name: Timeout
      description: Seconds to listen before giving up.
      required: false
      default: 60
      selector:
        number:
          min: 15
          max: 300
          unit_of_measurement: seconds
          mode: box

simulate:
  name: Inject a simulated telegram
  description: Admin only and disabled by default. Inject a marked preset into the real receive chain without radio transmission or persistence.
  fields:
    preset:
      name: Preset
      description: Telegram to inject.
      required: true
      selector:
        select:
          options:
            - window_open
            - window_closed
            - temperature
            - button
            - smoke_alarm
            - smoke_alarm_off
            - cover_position
    sender_id:
      name: Sender ID
      description: Four-byte EnOcean sender of the configured device, as AA:BB:CC:DD.
      required: true
      selector:
        text:
    position:
      name: Cover position
      description: Open percentage for the cover_position preset; ignored otherwise.
      required: false
      default: 50
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
          mode: box

send_teach_in:
  name: Send dimmer teach-in
  description: Send an A5-38-08 4BS teach-in telegram using the selected light entity's sender ID.
  target:
    entity:
      domain: light
      integration: enocean_custom

reload:
  name: Reload EnOcean YAML platforms
  description: Reload YAML-configured EnOcean platforms from the current configuration.
