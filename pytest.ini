[pytest]
# Scoped on purpose: tests/ is the existing stdlib unittest suite (run via
# `python -m unittest discover`) plus tests/ha_smoke.py, both untouched by
# this migration. testpaths keeps a bare `pytest` invocation from also
# trying to collect those files as pytest tests.
testpaths = tests/pytest
asyncio_mode = auto
# Coverage is scoped to exactly the modules this (deliberately partial)
# suite targets -- config_flow.py and diagnostics.py -- not the whole
# integration, which the much larger stdlib unittest suite already covers
# through a different harness. 65% is a regression floor a little under
# the ~71% this suite reaches today, not an aspirational target.
addopts =
    --cov=custom_components.enocean_custom.config_flow
    --cov=custom_components.enocean_custom.diagnostics
    --cov-report=term-missing
    --cov-fail-under=65
